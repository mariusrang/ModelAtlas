name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: make test (coverage must stay >= 60%)
        run: make test PYTEST_ARGS="--cov-fail-under=60"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Send coverage to Codecov (README badge)
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  stack:
    # Starts the real docker compose stack and runs the container health tests.
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Create .env for CI
        run: |
          cp .env.example .env
          sed -i 's/^NEO4J_PASSWORD=.*/NEO4J_PASSWORD=ci-password-123/' .env
          sed -i 's/^NEO4J_HEAP_SIZE=.*/NEO4J_HEAP_SIZE=1G/' .env
          sed -i 's/^NEO4J_PAGECACHE_SIZE=.*/NEO4J_PAGECACHE_SIZE=512M/' .env
      - name: make docker-run
        run: make docker-run
      - name: Wait until every service is healthy
        run: |
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format '{{.Service}} {{.Health}}' | grep -vw healthy || true)
            [ -z "$unhealthy" ] && echo "all healthy" && exit 0
            sleep 5
          done
          docker compose ps; docker compose logs --tail=50; exit 1
      - name: Install Python deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Load the sample graph (make seed-sample)
        run: make seed-sample
      - name: Run the graph algorithms (make gds-sample)
        run: make gds-sample
      - name: Predict missing parents (make predict-sample)
        run: make predict-sample
      - name: Container health + graph integration tests
        env:
          NEO4J_PASSWORD: ci-password-123
        run: make test-integration
      - name: Upload load report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-report-sample
          path: reports/*_sample.md
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
