[server]
headless = true
# Nginx sits in front of Streamlit, so the browser talks to Nginx's origin.
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# no "Deploy" button or developer menu in the app
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#D35F2C"
backgroundColor = "#FBFAF6"
secondaryBackgroundColor = "#F1EEE6"
textColor = "#14213D"
font = "sans serif"
